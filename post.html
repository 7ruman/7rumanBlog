<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>文章 · 7ruman的技术博客</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div class="progress-bar" id="progressBar"></div>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">7</span>
      <span class="brand-name">7ruman<em>·技术博客</em></span>
    </a>
    <nav class="nav">
      <a href="index.html">首页</a>
      <a href="projects.html">项目</a>
      <a href="index.html#posts">文章</a>
      <a href="index.html#about">关于</a>
      <button id="theme-toggle" class="icon-btn" title="切换主题" aria-label="切换主题">
        <svg class="ico-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      </button>
    </nav>
  </div>
</header>

<main class="container main">
  <div class="article-layout">
    <article id="article" class="article">
      <div id="loading" class="empty-tip">加载中…</div>
    </article>
    <aside class="toc" id="toc" hidden>
      <p class="toc-title">目录</p>
      <ul id="tocList"></ul>
    </aside>
  </div>
  <div class="post-nav">
    <a class="btn btn-ghost" href="index.html">← 返回首页</a>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <span>© <span id="year"></span> 7ruman · 技术博客</span>
    <span class="muted">用 Markdown 驱动 · 零依赖静态站点</span>
  </div>
</footer>

<button class="back-to-top" id="backToTop" aria-label="返回顶部" title="返回顶部">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
</button>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览">
  <button class="lightbox-close" id="lightboxClose" aria-label="关闭">×</button>
  <img id="lightboxImg" alt="" />
  <div class="lightbox-cap" id="lightboxCap"></div>
</div>

<script src="assets/js/markdown.js"></script>
<script src="assets/js/highlight.js"></script>
<script src="assets/js/post.js"></script>
</body>
</html>
